name: Apply Endpoint Only Mode

on:
  push:
    paths:
      - 'scripts/apply-endpoint-only.js'
      - '.github/workflows/apply-endpoint-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/apply-endpoint-only.js
      - name: Commit implementation
        run: |
          if git diff --quiet -- index.html; then
            echo "No implementation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add endpoint-only mode"
          git push
