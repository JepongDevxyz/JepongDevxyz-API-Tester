name: Apply Live Model Status

on:
  push:
    paths:
      - 'scripts/apply-live-model-status.py'
      - '.github/workflows/apply-live-model-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-live-model-status.py
      - name: Commit implementation
        run: |
          if git diff --quiet -- index.html; then
            echo "No implementation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add live model status checks"
          git push
