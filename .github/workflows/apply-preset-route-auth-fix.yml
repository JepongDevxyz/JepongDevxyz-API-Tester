name: Apply Preset Route Auth Fix

on:
  push:
    paths:
      - 'scripts/fix-preset-route-auth.py'
      - '.github/workflows/apply-preset-route-auth-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 scripts/fix-preset-route-auth.py
      - name: Commit fix
        run: |
          if git diff --quiet -- lib/proxy-core.js lib/provider-presets.js; then
            echo "No production changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/proxy-core.js lib/provider-presets.js
          git commit -m "fix: preserve preset base paths and Fireworks auth"
          git push
