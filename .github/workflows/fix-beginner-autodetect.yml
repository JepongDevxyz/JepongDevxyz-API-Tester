name: Fix Beginner Auto Detect

on:
  push:
    paths:
      - 'scripts/fix-beginner-autodetect-markers.js'
      - '.github/workflows/fix-beginner-autodetect.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply targeted fix
        run: node scripts/fix-beginner-autodetect-markers.js
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No marker cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clean auto-detect function boundaries"
          git push
